<!Doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<title>Vietnam Globe — Day/Night + Timeline</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
  :root{--ui-bg:rgba(6,10,20,0.6);--ui-border:rgba(255,255,255,0.06);--label-bg:rgba(0,0,0,0.55)}
  html,body{height:100%;margin:0;background:#001226;color:#e6eef8;font-family:system-ui,Arial;overflow:hidden}
  canvas{display:block}

  /* Top-left UI */
  #ui {
    position:absolute; left:12px; top:12px; z-index:60;
    background:var(--ui-bg); border:1px solid var(--ui-border);
    padding:10px; border-radius:12px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;
    backdrop-filter: blur(6px);
  }
  button, select {cursor:pointer}
  button{background:#0f1724;color:#dbeafe;border:1px solid var(--ui-border); padding:6px 10px;border-radius:10px}
  label.ui{display:flex;align-items:center;gap:6px}
  .ctrl-group{display:flex;gap:8px;align-items:center}

  /* Timeline small (bottom center) */
  #timelineWrap{
    position:absolute; left:50%; transform:translateX(-50%); bottom:28px; z-index:60;
    display:flex; flex-direction:column; gap:6px; align-items:center; width:min(92vw,1100px);
    pointer-events:auto;
  }
  #timelineBar{
    position:relative; width:100%; height:36px; border-top:2px solid rgba(255,255,255,0.12);
    user-select:none; background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
  }
  .tick { position:absolute; top:0; width:1px; background:rgba(255,255,255,0.18); }
  .tick.small { background:rgba(255,255,255,0.08); height:8px; }
  .tick-label {
    position:absolute; top:12px; font-size:10px; color:rgba(230,238,248,0.9);
    white-space:nowrap; transform:translateX(-50%);
    text-shadow:0 1px 0 rgba(0,0,0,0.6);
  }
  #handle {
    position:absolute; top:-6px; width:14px; height:14px; border-radius:50%;
    background:#ffcc00; box-shadow:0 2px 6px rgba(0,0,0,0.6); transform:translateX(-50%);
    cursor:grab; z-index:5;
  }
  #timeReadout{
    background:var(--ui-bg); border:1px solid var(--ui-border); border-radius:10px;
    padding:6px 10px; font-family:monospace; font-size:13px;
  }
  /* small controls row above timeline */
  #timelineControls{ display:flex; gap:8px; align-items:center; margin-bottom:6px; }

  /* Stats bottom-left */
  #stats{position:absolute; left:12px; bottom:12px; z-index:70; pointer-events:none}

  /* Credits bottom-right */
  #credits{position:absolute; right:12px; bottom:12px; z-index:50; font-size:12px; opacity:0.7}

  /* Labels (divs projected) */
  .label{
    position:absolute; transform:translate(-50%,-50%); pointer-events:none; white-space:nowrap;
    text-shadow:0 0 6px rgba(0,0,0,0.9); z-index:55; font-size:10px;
    background:var(--label-bg); padding:1px 5px; border-radius:6px; color:#fff;
  }
  .label.island{ background:#fff3b8; color:#000 }
  .label.province{ background:rgba(15,23,36,0.7); border:1px solid rgba(255,255,255,0.08); font-size:10px }
  .label.country{ font-weight:800; font-size:16px; background:transparent; color:#ffd76b; text-shadow:none; letter-spacing:1px }

  @media (max-width:640px){
    #ui{left:8px; top:8px}
    #timelineWrap{bottom:18px}
    .tick-label{font-size:9px}
    .label{font-size:9px}
  }
</style>

<!-- SunCalc for sun position -->
<script src="https://unpkg.com/suncalc@1.9.0/suncalc.js"></script>

<!-- importmap for three -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/examples/jsm/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="ui">
    <div class="ctrl-group">
      <button id="btnRotate">⏯ Bật xoay</button>
      <button id="btnPlay">▶︎</button>
      <button id="btnStepBack">⏮</button>
      <button id="btnStepFwd">⏭</button>
    </div>

    <label class="ui">Speed
      <select id="speedSel">
        <option value="1">1x</option>
        <option value="2">2x</option>
        <option value="3">3x</option>
        <option value="4">4x</option>
        <option value="5">5x</option>
      </select>
    </label>

    <div style="width:8px"></div>
    <div id="credits-mini" style="font-size:12px;opacity:.9">VIỆT NAM • Day-only shading</div>
  </div>

  <!-- Timeline area -->
  <div id="timelineWrap">
    <div id="timelineControls">
      <label style="font-size:13px">Timeline</label>
      <div id="timelineLegend" style="font-size:12px;color:#cfe8ff;opacity:0.9"></div>
    </div>
    <div id="timelineBar" aria-hidden="false"></div>
    <div id="timeReadout">UTC: -- | VN: -- | Slider: --</div>
  </div>

  <div id="stats"></div>
  <div id="credits">GeoJSON: local `VNM_1.geojson` • Texture: `light.jpg`</div>

  <script type="module">
  import * as THREE from "three";
  import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";
  import Stats from "three/examples/jsm/libs/stats.module.js";

  // --- Config ---
  const EARTH_R = 5;
  const INITIAL_LAT = 15.5, INITIAL_LON = 108;
  const INITIAL_DIST = EARTH_R + 7;

  const CITY_SHOW_DISTANCE = EARTH_R + 1.0;
  const PROVINCE_SHOW_DISTANCE = EARTH_R + 1.0;
  const COUNTRY_LABEL_HIDE_DISTANCE = EARTH_R + 5.0;

  const PROVINCES_LOCAL = 'VNM_1.geojson';
  const DAY_TEX = 'light.jpg'; // required local

  // --- Scene & Renderer ---
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x001226);
  const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  // --- Controls ---
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.minDistance = EARTH_R + 0.5;
  controls.maxDistance = EARTH_R + 60;
  controls.enablePan = false;
  controls.autoRotate = false;
  controls.autoRotateSpeed = 30;

  // --- Stats (FPS) ---
  const stats = new Stats();
stats.dom.style.position = "absolute";

// xóa đi mặc định
stats.dom.style.top = "auto";
stats.dom.style.left = "auto";

// đặt vị trí mới
stats.dom.style.left = "0px";
stats.dom.style.bottom = "0px";

document.body.appendChild(stats.dom);

  // --- Lights ---
  const ambient = new THREE.AmbientLight(0xffffff, 0.35); scene.add(ambient);
  const sunLight = new THREE.DirectionalLight(0xffffff, 1.0); scene.add(sunLight);

  // --- Globals ---
  const texLoader = new THREE.TextureLoader();
  let dayTex = null;
  let earth = null;
  let provincesGroup = new THREE.Group();
  let provinceLabels = [];
  let markers = [];
  let countryLabel = null;

  // Time & timeline state
  let isPlaying = false;
  const baseRealNow = Date.now();   // <-- thêm dòng này
  // ms ref point
  let timelineOffsetMin = 0;      // minutes offset from now
  let playSpeed = 1;


  // Timeline config for ticks
  const tickHours = 12;          // tick each 12h
  const visibleSpanDays = 4;     // display 4 days centered on now
  const totalTicks = (24*visibleSpanDays) / tickHours; // 4 days -> 8 ticks
  const timelineBar = document.getElementById('timelineBar');
  const timelineLegend = document.getElementById('timelineLegend');

  // handle element
  const handle = document.createElement('div');
  handle.id = 'handle';
  timelineBar.appendChild(handle);

  // --- Init ---
  (async function init(){
    dayTex = await loadTexture(DAY_TEX);

    // earth material (day only shading with soft night)
    const earthMat = makeDayNightMaterial(dayTex);
    earth = new THREE.Mesh(new THREE.SphereGeometry(EARTH_R, 128, 128), earthMat);
    scene.add(earth);

    // atmosphere
    const atm = new THREE.Mesh(
      new THREE.SphereGeometry(EARTH_R*1.02, 64, 64),
      new THREE.MeshBasicMaterial({ color:0x88ccff, transparent:true, opacity:0.04, side:THREE.BackSide })
    );
    scene.add(atm);

    // load provinces
    await loadProvinces(PROVINCES_LOCAL);

    // markers (small dots)
    [
      {name:'Hà Nội', lat:21.0285, lon:105.8544},
      {name:'TP.HCM', lat:10.7769, lon:106.7009},
      {name:'Đà Nẵng', lat:16.0471, lon:108.2022},
      {name:'Hải Phòng', lat:20.8449, lon:106.6881},
      {name:'Cần Thơ', lat:10.0452, lon:105.7689},
      {name:'Huế', lat:16.4637, lon:107.58},
      {name:'Quần Đảo Hoàng Sa', lat:16.5, lon:111.5, type:'island'},
      {name:'Quần Đảo Trường Sa', lat:8.6, lon:114.3, type:'island'},
    ].forEach(c=> addMarker(c.name, c.lat, c.lon, c.type||'city'));

    // country label
    addCountryLabel('VIỆT NAM', 15.5, 108);

    // camera
    setCameraToLatLon(INITIAL_LAT, INITIAL_LON, INITIAL_DIST);

    // UI
    setupUI();

    // build ticks
    buildTimelineTicks();

    // place handle initial
    placeHandleFromOffset();

    // render
    animate();
  })();

  // --- Loaders / Materials ---
  function loadTexture(path){
    return new Promise((res, rej)=> texLoader.load(path, t=>res(t), undefined, rej));
  }

  function makeDayNightMaterial(dayMap){
    const uniforms = {
      dayTex: { value: dayMap },
      sunDir: { value: new THREE.Vector3(1,0,0).normalize() },
      nightIntensity: { value: 0.25 }
    };
    const mat = new THREE.ShaderMaterial({
      uniforms,
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vWorldNormal;
        void main(){
          vUv = uv;
          vWorldNormal = normalize(normalMatrix * normal);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying vec2 vUv;
        varying vec3 vWorldNormal;
        uniform sampler2D dayTex;
        uniform vec3 sunDir;
        uniform float nightIntensity;
        void main(){
          vec3 N = normalize(vWorldNormal);
          float ndotl = max(dot(N, normalize(sunDir)), 0.0);
          vec3 dayCol = texture2D(dayTex, vUv).rgb;
          vec3 color = dayCol * (nightIntensity + (1.0 - nightIntensity) * ndotl);
          gl_FragColor = vec4(color, 1.0);
        }
      `,
      side: THREE.FrontSide
    });
    return mat;
  }

  // --- Provinces & labels ---
  async function loadProvinces(localName){
    let gj = null;
    try {
      const r = await fetch(localName);
      if(r.ok) gj = await r.json();
    } catch(e){ console.warn('fetch provinces failed', e); return; }
    if(!gj) return;
    provincesGroup.clear();
    provinceLabels = [];
    const lineMat = new THREE.LineBasicMaterial({ color:0x69c3ff, linewidth:1, opacity:0.9 });
    (gj.features || []).forEach(f=>{
      const geom = f.geometry; if(!geom) return;
      const name = f.properties?.ten_tinh || f.properties?.name || '—';
      if(geom.type === 'Polygon'){
        geom.coordinates.forEach(ring => ringToLines(ring, lineMat));
        const c = centroidOfPolygon(geom.coordinates);
        if(c) addProvinceLabel(name, c[1], c[0]);
      } else if(geom.type === 'MultiPolygon'){
        geom.coordinates.forEach(poly => poly.forEach(ring => ringToLines(ring, lineMat)));
        const c = centroidOfMultiPolygon(geom.coordinates);
        if(c) addProvinceLabel(name, c[1], c[0]);
      }
    });
    earth.add(provincesGroup);
  }

  function ringToLines(ring, material){
    const pts = ring.map(([lon,lat])=> latLonToVec3(lat, lon, EARTH_R + 0.03));
    if(pts.length && !pts[0].equals(pts[pts.length-1])) pts.push(pts[0].clone());
    const geom = new THREE.BufferGeometry().setFromPoints(pts);
    const line = new THREE.Line(geom, material);
    provincesGroup.add(line);
  }

  function addProvinceLabel(name, lat, lon){
    const div = document.createElement('div');
    div.className = 'label province';
    div.textContent = name;
    div.style.display = 'none';
    document.body.appendChild(div);
    const pos = latLonToVec3(lat, lon, EARTH_R + 0.04);
    provinceLabels.push({ name, pos, div });
  }

  // --- Markers & labels ---
  function addMarker(name, lat, lon, type='city'){
    const pos = latLonToVec3(lat, lon, EARTH_R + 0.02);
    const mat = new THREE.MeshBasicMaterial({ color: type==='island' ? 0xffcc00 : 0x2ea0ff });
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 8), mat);
    mesh.position.copy(pos);
    earth.add(mesh);
    const div = document.createElement('div');
    div.className = 'label' + (type==='island' ? ' island' : '');
    div.textContent = name;
    div.style.display = 'none';
    document.body.appendChild(div);
    markers.push({ name, lat, lon, mesh, div, type });
  }

  function addCountryLabel(text, lat, lon){
    const div = document.createElement('div');
    div.className = 'label country';
    div.textContent = text;
    div.style.display = 'none';
    document.body.appendChild(div);
    const pos = latLonToVec3(lat, lon, EARTH_R + 0.05);
    countryLabel = { div, pos };
  }

  // --- Math helpers ---
  function latLonToVec3(lat,lon,r=EARTH_R){
    const phi = (90-lat)*Math.PI/180;
    const theta = (lon+180)*Math.PI/180;
    return new THREE.Vector3(-r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
  }
  function projectToScreen(v3World){
    const p = v3World.clone().project(camera);
    return { x:(p.x*0.5+0.5)*innerWidth, y:(-p.y*0.5+0.5)*innerHeight, z:p.z };
  }
  function centroidOfPolygon(pol){
    const ring = pol?.[0]; if(!ring) return null;
    let sx=0, sy=0, n=0; ring.forEach(([x,y])=>{sx+=x; sy+=y; n++;});
    if(!n) return null; return [sx/n, sy/n];
  }
  function centroidOfMultiPolygon(mpol){
    let sx=0, sy=0, n=0;
    mpol.forEach(pol=>{ const c = centroidOfPolygon(pol); if(c){sx+=c[0]; sy+=c[1]; n++;}});
    if(!n) return null; return [sx/n, sy/n];
  }

  function setCameraToLatLon(lat, lon, distance=INITIAL_DIST){
    const phi = (90-lat)*Math.PI/180;
    const theta = (lon+180)*Math.PI/180;
    const x = - distance * Math.sin(phi) * Math.cos(theta);
    const y =     distance * Math.cos(phi);
    const z =     distance * Math.sin(phi) * Math.sin(theta);
    camera.position.set(x,y,z);
    camera.lookAt(0,0,0);
    controls.update();
  }

  // --- UI wiring ---
  function setupUI(){
    const btnRotate = document.getElementById('btnRotate');
    btnRotate.addEventListener('click', ()=>{
      controls.autoRotate = !controls.autoRotate;
      btnRotate.textContent = controls.autoRotate ? '⏯ Tắt xoay' : '⏯ Bật xoay';
    });

    const speedSel = document.getElementById('speedSel');
    speedSel.addEventListener('change', ()=>{ playSpeed = parseInt(speedSel.value,10) || 1; });

    // play / pause
    document.getElementById('btnPlay').addEventListener('click', ()=>{
      isPlaying = !isPlaying;
      document.getElementById('btnPlay').textContent = isPlaying ? '⏸' : '▶︎';
    });

    // step buttons: +/- 1 hour per click
    document.getElementById('btnStepBack').addEventListener('click', ()=>{
      timelineOffsetMin -= 60;
      updateTimeReadout();
      forceUpdateTimeDependencies();
      placeHandleFromOffset();
    });
    document.getElementById('btnStepFwd').addEventListener('click', ()=>{
      timelineOffsetMin += 60;
      updateTimeReadout();
      forceUpdateTimeDependencies();
      placeHandleFromOffset();
    });

    // click on timelineBar to set offset
    timelineBar.addEventListener('click', (ev)=>{
      // ignore clicks on handle (handled separately)
      if(ev.target === handle) return;
      const rect = timelineBar.getBoundingClientRect();
      const x = ev.clientX - rect.left;
      const frac = Math.min(1, Math.max(0, x / rect.width));
      const spanMs = visibleSpanDays * 24 * 3600 * 1000;
      const center = Date.now();
      const t = center - spanMs/2 + frac * spanMs;
      timelineOffsetMin = Math.round((t - baseRealNow) / (60*1000));
      updateTimeReadout();
      forceUpdateTimeDependencies();
      placeHandleFromOffset();
    });

    // handle dragging
    let dragging = false;
    handle.addEventListener('mousedown', (e)=>{ dragging = true; handle.style.cursor='grabbing'; e.preventDefault(); });
    window.addEventListener('mouseup', ()=>{ dragging = false; handle.style.cursor='grab'; });
    window.addEventListener('mousemove', (ev)=>{
      if(!dragging) return;
      const rect = timelineBar.getBoundingClientRect();
      const x = Math.min(rect.width, Math.max(0, ev.clientX - rect.left));
      const frac = x / rect.width;
      const spanMs = visibleSpanDays * 24 * 3600 * 1000;
      const center = Date.now();
      const t = center - spanMs/2 + frac * spanMs;
      timelineOffsetMin = Math.round((t - baseRealNow) / (60*1000));
      updateTimeReadout();
      forceUpdateTimeDependencies();
      placeHandleFromOffset();
    });

    // initialize
    playSpeed = parseInt(speedSel.value,10) || 1;
    updateTimeReadout();
  }

  // --- Timeline ticks construction ---
  function buildTimelineTicks(){
    timelineBar.querySelectorAll('.tick, .tick-label').forEach(n=>n.remove());
    // compute a VN-aligned reference: find VN epoch multiple of 12h (UTC timestamp)
    const nowUTC = Date.now();
    const ms12h = 12*3600*1000;
    const vnOffsetMs = 7*3600*1000;
    // vnEpoch = floor((nowUTC + vnOffset)/12h) * 12h
    const vnEpochBase = Math.floor((nowUTC + vnOffsetMs) / ms12h) * ms12h;
    // tick reference in UTC coordinates:
    const tickRefUTC = vnEpochBase - vnOffsetMs;
    // We want ticks from start = tickRefUTC - span/2 to end = start + span
    const spanMs = visibleSpanDays * 24 * 3600 * 1000;
    const start = tickRefUTC - spanMs/2;

    for(let i=0;i<=totalTicks;i++){
      const tUtc = start + i * tickHours * 3600 * 1000;
      const frac = (i/totalTicks) * 100;
      const tick = document.createElement('div');
      tick.className = 'tick' + (i%2 ? ' small' : '');
      tick.style.left = frac + '%';
      tick.style.height = (i%2===0 ? '18px' : '10px');
      timelineBar.appendChild(tick);
      if(i%2===0){
        const label = document.createElement('div');
        label.className = 'tick-label';
        const dt = new Date(tUtc);
        // display VN-local label so 12:00 marks VN noon
        const vn = new Date(dt.getTime() + 7*3600*1000);
        const day = vn.getUTCDate().toString().padStart(2,'0');
        const mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][vn.getUTCMonth()];
        const hh = vn.getUTCHours().toString().padStart(2,'0');
        const mm = vn.getUTCMinutes().toString().padStart(2,'0');
        label.textContent = `${day} ${mon} ${hh}:${mm}`;
        label.style.left = frac + '%';
        timelineBar.appendChild(label);
      }
    }
    timelineLegend.textContent = `Span: ${visibleSpanDays} days · Tick: ${tickHours}h · Ticks aligned to VN 00:00/12:00`;
  }

  // --- place handle from timelineOffsetMin ---
  function placeHandleFromOffset(){
    const spanMs = visibleSpanDays * 24 * 3600 * 1000;
    const start = Date.now() - spanMs/2;
    const t = baseRealNow + timelineOffsetMin*60*1000;
    const frac = (t - start) / spanMs;
    const clamped = Math.min(1, Math.max(0, frac));
    handle.style.left = (clamped*100) + '%';
  }

  // --- Time helpers & readout ---
  function getSimulatedDate(){
    return new Date(baseRealNow + timelineOffsetMin*60*1000);
  }

  function updateTimeReadout() {
  const realNow = new Date();

  // UTC chuẩn, không slice chuỗi linh tinh
  const utcNowStr = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'UTC',
    day: '2-digit', month: 'short', year: 'numeric',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
    hour12: false
  }).format(realNow).replace(',', '');

  // VN chuẩn theo Asia/Ho_Chi_Minh (không cộng +7h thủ công)
  const vnNowStr = new Intl.DateTimeFormat('vi-VN', {
    timeZone: 'Asia/Ho_Chi_Minh',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
    hour12: false
  }).format(realNow);

  const sim = getSimulatedDate(); // thời gian slider
  const sliderLabel = formatSliderDate(sim);

  document.getElementById("timeReadout").textContent =
    `UTC (real): ${utcNowStr} | VN (real): ${vnNowStr} | Slider: ${sliderLabel}`;
}


setInterval(updateTimeReadout, 1000);  // update mỗi giây

// Định nghĩa hàm formatSliderDate
function formatSliderDate(date) {
  if (!(date instanceof Date)) return "";
  const d = date.getDate().toString().padStart(2, "0");
  const m = (date.getMonth() + 1).toString().padStart(2, "0");
  const y = date.getFullYear();
  const hh = date.getHours().toString().padStart(2, "0");
  const mm = date.getMinutes().toString().padStart(2, "0");
  return `${d}/${m}/${y} ${hh}:${mm}`;
}

  // Compute earth rotation from simulated time (keeps rotation continuous)
  function updateEarthRotationFromTime(simDate){
    const hoursSinceBase = (simDate.getTime() - baseRealNow) / (1000*60*60);
    earth.rotation.y = hoursSinceBase * (Math.PI*2/24);
  }

  function forceUpdateTimeDependencies(){
    const sim = getSimulatedDate();
    updateEarthRotationFromTime(sim);
    updateSunForSimulatedTime(sim);
  }

  function updateSunForSimulatedTime(simDate){
  // Lấy vị trí mặt trời tại VN (lat=15.5, lon=108)
  const sunPos = SunCalc.getPosition(simDate, 15.5, 108);
  const x = Math.cos(sunPos.altitude) * Math.cos(sunPos.azimuth);
  const y = Math.sin(sunPos.altitude);
  const z = Math.cos(sunPos.altitude) * Math.sin(sunPos.azimuth);

  // cập nhật hướng ánh sáng
  sunLight.position.set(x, y, z);
  if (earth && earth.material.uniforms) {
    earth.material.uniforms.sunDir.value.set(x, y, z).normalize();
  }
}

  // --- Render loop ---
  let last = performance.now();
  function animate(){
    requestAnimationFrame(animate);
    const now = performance.now();
    const dt = (now - last)/1000; last = now;

    // playing -> advance timelineOffsetMin
    if(isPlaying){
      timelineOffsetMin += dt * playSpeed * 60; // dt seconds -> dt*60 minutes * speed
      timelineOffsetMin = Math.round(timelineOffsetMin);
      updateTimeReadout();
      forceUpdateTimeDependencies();
      placeHandleFromOffset();
    }

// update markers/labels
const camDist = camera.position.length();
for(const m of markers){
  const worldPos = new THREE.Vector3();
  m.mesh.getWorldPosition(worldPos);
  const scr = projectToScreen(worldPos);
  const visible = camDist < CITY_SHOW_DISTANCE && scr.z < 1;
  m.div.style.display = visible ? 'block' : 'none';
  if(visible){
    m.div.style.left = `${scr.x}px`;
    m.div.style.top  = `${scr.y}px`;

// --- Auto scale marker ---
// zoom gần -> nhỏ, zoom xa -> to
let near = 2000;    // khoảng cách gần
let far  = 30000;   // khoảng cách xa
let minSize = 3;    // px
let maxSize = 18;   // px

// nội suy tuyến tính từ near -> far
let t = (camDist - near) / (far - near);
t = Math.min(1, Math.max(0, t)); // clamp 0..1
let size = minSize + t * (maxSize - minSize);

m.div.style.width  = `${size}px`;
m.div.style.height = `${size}px`;
m.div.style.borderRadius = "50%";
m.div.style.background = "red";
m.div.style.pointerEvents = "none";
m.div.style.position = "absolute";
m.div.style.transform = "translate(-50%, -50%)";
  }
}

    const showProv = camDist < PROVINCE_SHOW_DISTANCE;
    for(const pl of provinceLabels){
      const worldPos = pl.pos.clone().applyMatrix4(earth.matrixWorld);
      const scr = projectToScreen(worldPos);
      const vis = showProv && scr.z < 1;
      pl.div.style.display = vis ? 'block' : 'none';
      if(vis){ pl.div.style.left = `${scr.x}px`; pl.div.style.top = `${scr.y}px`; }
    }

    if(countryLabel){
      const worldPos = countryLabel.pos.clone().applyMatrix4(earth.matrixWorld);
      const scr = projectToScreen(worldPos);
      const anyProvVisible = showProv;
      const anyMarkerVisible = camDist < CITY_SHOW_DISTANCE;
      const showCountry = !anyProvVisible && !anyMarkerVisible && camDist >= COUNTRY_LABEL_HIDE_DISTANCE && scr.z < 1;
      countryLabel.div.style.display = showCountry ? 'block' : 'none';
      if(showCountry){ countryLabel.div.style.left = `${scr.x}px`; countryLabel.div.style.top = `${scr.y}px`; }
    }

    controls.update();
    renderer.render(scene, camera);
    stats.update();
  }

// Resize
window.addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  buildTimelineTicks();
  placeHandleFromOffset();  
});

  // initial utility placement/calls
  // place handle initially after small delay (once timeline built)
  setTimeout(()=>{ buildTimelineTicks(); placeHandleFromOffset(); }, 120);

  </script>
</body>
</html>
