<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cesium Việt Nam MAP - Level 2</title>
  <script src="https://cdn.jsdelivr.net/npm/cesium/Build/Cesium/Cesium.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/cesium/Build/Cesium/Widgets/widgets.css" rel="stylesheet"/>
  <style>
    #cesiumContainer {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
<div id="cesiumContainer"></div>

<script>
    const viewer = new Cesium.Viewer('cesiumContainer', {
      timeline: false,
      animation: false,
      baseLayerPicker: false,
      geocoder: false,
      homeButton: false,
      sceneModePicker: false,
      navigationHelpButton: false,
    });
    
    viewer.scene.screenSpaceCameraController.minimumZoomDistance = 200;
    viewer.scene.screenSpaceCameraController.maximumZoomDistance = 50000000;
    
    viewer.camera.setView({
      destination: Cesium.Rectangle.fromDegrees(102, 8, 114, 24),
      orientation: { heading: 0, pitch: -Cesium.Math.PI_OVER_TWO, roll: 0 }
    });
    
    // Mảng lưu
    const provincePolygons = [];
    const provinceLabels = [];
    const districtPolygons = [];
    const districtLabels = [];
    
    // Load tỉnh
    Cesium.GeoJsonDataSource.load('./VNM_1.geojson', {
      stroke: Cesium.Color.YELLOW,
      strokeWidth: 2
    }).then(ds => {
      viewer.dataSources.add(ds);
      ds.entities.values.forEach(e => {
        if (e.polygon) {
          e.polygon.height = 0;
          e.polygon.outline = true;
          e.polygon.outlineColor = Cesium.Color.YELLOW;
          e.polygon.material = Cesium.Color.YELLOW.withAlpha(0.1);
          provincePolygons.push(e);
    
          const center = Cesium.Rectangle.center(Cesium.Rectangle.fromCartesianArray(
            e.polygon.hierarchy.getValue(Cesium.JulianDate.now()).positions
          ));
          provinceLabels.push(viewer.entities.add({
            position: Cesium.Cartesian3.fromDegrees(
              Cesium.Math.toDegrees(center.longitude),
              Cesium.Math.toDegrees(center.latitude)
            ),
            label: {
              text: e.properties.name || e.properties.ten_tinh || '???',
              font: 'bold 20px "Times New Roman", serif',
              fillColor: Cesium.Color.WHITE,
              outlineColor: Cesium.Color.BLACK,
              outlineWidth: 2,
              style: Cesium.LabelStyle.FILL_AND_OUTLINE,
              show: false
            }
          }));
        }
      });
    });
    
    // Load huyện
    Cesium.GeoJsonDataSource.load('./VNM_2.json', {
      stroke: Cesium.Color.RED,
      strokeWidth: 1
    }).then(ds => {
      viewer.dataSources.add(ds);
      ds.entities.values.forEach(e => {
        if (e.polygon) {
          e.polygon.height = 0;
          e.polygon.outline = true;
          e.polygon.outlineColor = Cesium.Color.RED;
          e.polygon.material = Cesium.Color.RED.withAlpha(0.15);
          districtPolygons.push(e);
    
          const center = Cesium.Rectangle.center(Cesium.Rectangle.fromCartesianArray(
            e.polygon.hierarchy.getValue(Cesium.JulianDate.now()).positions
          ));
          let name = '???';
          if (e.properties && e.properties.NAME_2) {
            name = e.properties.NAME_2.getValue();
          }
          districtLabels.push(viewer.entities.add({
            position: Cesium.Cartesian3.fromDegrees(
              Cesium.Math.toDegrees(center.longitude),
              Cesium.Math.toDegrees(center.latitude)
            ),
            label: {
              text: name,
              font: 'bold 14px "Times New Roman", serif',
              fillColor: Cesium.Color.WHITE,
              outlineColor: Cesium.Color.BLACK,
              outlineWidth: 2,
              style: Cesium.LabelStyle.FILL_AND_OUTLINE,
              show: false
            }
          }));
        }
      });
    });
    
    // Label Việt Nam
    const vietnamLabel = viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(107, 16),
      label: {
        text: "VIỆT NAM",
        font: "bold 30px 'Times New Roman', serif",
        fillColor: Cesium.Color.BLACK,
        outlineColor: Cesium.Color.WHITE,
        outlineWidth: 3,
        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
        verticalOrigin: Cesium.VerticalOrigin.CENTER,
        show: true
      }
    });
    
    // Hàm cập nhật
    function updateView() {
      const h = viewer.camera.positionCartographic.height;
    
      const showVNLabel = h > 600000;
      const showProvinceLabel = h <= 500000;
      const showDistrict = h < 400000;
      const hideDistrictPolygon = h < 200000;
    
      vietnamLabel.label.show = showVNLabel;
    
      provinceLabels.forEach(l => l.label.show = showProvinceLabel);
      provincePolygons.forEach(p => p.show = !showDistrict);
    
      districtLabels.forEach(l => l.label.show = showDistrict);
      districtPolygons.forEach(p => {
        if (!showDistrict) {
          p.show = false;
        } else {
          p.show = true;
          p.polygon.material = hideDistrictPolygon ? Cesium.Color.TRANSPARENT : Cesium.Color.RED.withAlpha(0.15);
        }
      });
    }
    
    viewer.camera.changed.addEventListener(updateView);
    updateView();
    </script>
