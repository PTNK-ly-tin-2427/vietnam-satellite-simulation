<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cesium Việt Nam MAP</title>
  <script src="https://cdn.jsdelivr.net/npm/cesium/Build/Cesium/Cesium.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/cesium/Build/Cesium/Widgets/widgets.css" rel="stylesheet"/>
  <style>
    #cesiumContainer {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>

  <script>
    const viewer = new Cesium.Viewer('cesiumContainer', {
      timeline: false,
      animation: false,
      baseLayerPicker: false,
      geocoder: false,
      homeButton: false,
      sceneModePicker: false,
      navigationHelpButton: false,
    });

    viewer.scene.screenSpaceCameraController.minimumZoomDistance = 200;
    viewer.scene.screenSpaceCameraController.maximumZoomDistance = 50000000;

    viewer.camera.setView({
      destination: Cesium.Rectangle.fromDegrees(102, 8, 114, 24),
      orientation: {
        heading: Cesium.Math.toRadians(0),
        pitch: Cesium.Math.toRadians(-90),
        roll: 0
      }
    });

    Cesium.GeoJsonDataSource.load('./VNM_1.geojson', {
      stroke: Cesium.Color.YELLOW,
      strokeWidth: 2,
      clampToGround: false
    }).then(dataSource => {
      viewer.dataSources.add(dataSource);
      const entities = dataSource.entities.values;

      for (let i = 0; i < entities.length; i++) {
        const entity = entities[i];
        if (entity.polygon) {
          entity.polygon.height = 0;
          entity.polygon.outline = true;
          entity.polygon.outlineColor = Cesium.Color.YELLOW;
          entity.polygon.material = Cesium.Color.YELLOW.withAlpha(0.1); // mặc định màu vàng nhạt

          // Tính tâm tỉnh
          const hierarchy = entity.polygon.hierarchy.getValue(Cesium.JulianDate.now());
          const positions = hierarchy.positions;
          const rectangle = Cesium.Rectangle.fromCartesianArray(positions);
          const center = Cesium.Rectangle.center(rectangle);
          const lonCentroid = Cesium.Math.toDegrees(center.longitude);
          const latCentroid = Cesium.Math.toDegrees(center.latitude);

          // Label tỉnh
          viewer.entities.add({
            position: Cesium.Cartesian3.fromDegrees(lonCentroid, latCentroid),
            label: {
              text: entity.properties.name || entity.properties.ten_tinh || '???',
              font: 'bold 20px "Times New Roman", serif',
              fillColor: Cesium.Color.WHITE,
              outlineColor: Cesium.Color.BLACK,
              outlineWidth: 2,
              style: Cesium.LabelStyle.FILL_AND_OUTLINE,
              verticalOrigin: Cesium.VerticalOrigin.CENTER,
              show: false,
              scaleByDistance: new Cesium.NearFarScalar(500000, 1.0, 1500000, 0.0)
            }
          });
        }
      }

      //  Marker các thành phố lớn
      const majorCities = [
        { name: "Hà Nội", lon: 105.8544, lat: 21.0285 },
        { name: "TP.HCM", lon: 106.6297, lat: 10.8231 },
        { name: "Đà Nẵng", lon: 108.2022, lat: 16.0471 },
        { name: "Hải Phòng", lon: 106.6823, lat: 20.8449 },
        { name: "Cần Thơ", lon: 105.7689, lat: 10.0452 },
        { name: "Huế", lon: 107.5800, lat: 16.4637 },
      ];

      majorCities.forEach(city => {
        viewer.entities.add({
          position: Cesium.Cartesian3.fromDegrees(city.lon, city.lat),
          point: {
            pixelSize: 10,
            color: Cesium.Color.BLUE,
            outlineColor: Cesium.Color.WHITE,
            outlineWidth: 2,
            heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
          },
          label: {
            text: city.name,
            font: "bold 25px 'Times New Roman', serif",
            fillColor: Cesium.Color.PINK,
            outlineColor: Cesium.Color.WHITE,
            outlineWidth: 1,
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
            pixelOffset: new Cesium.Cartesian2(0, -15),
            scaleByDistance: new Cesium.NearFarScalar(500000, 1.0, 1500000, 0.0)
          }
        });
      });

      // Marker & polygon vùng cho đảo
      const islands = [
        {
          name: "Quần Đảo Hoàng Sa",
          lon: 111.5,
          lat: 16.5,
          polygon: [
            [111.3, 16.3],
            [111.7, 16.3],
            [111.7, 16.7],
            [111.3, 16.7]
          ]
        },
        {
          name: "Quần Đảo Trường Sa",
          lon: 114.3,
          lat: 8.6,
          polygon: [
            [114.1, 8.4],
            [114.5, 8.4],
            [114.5, 8.8],
            [114.1, 8.8]
          ]
        }
      ];

      islands.forEach(island => {
        // Marker
        viewer.entities.add({
          position: Cesium.Cartesian3.fromDegrees(island.lon, island.lat),
          point: {
            pixelSize: 10,
            color: Cesium.Color.YELLOW,
            outlineColor: Cesium.Color.BLACK,
            outlineWidth: 2
          },
          label: {
            text: island.name,
            font: "bold 25px 'Times New Roman', serif",
            fillColor: Cesium.Color.PINK,
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
            pixelOffset: new Cesium.Cartesian2(0, -10)
          }
        });

      })

      //  Label lớn VIỆT NAM khi zoom xa
      const vietnamLabel = viewer.entities.add({
        position: Cesium.Cartesian3.fromDegrees(107, 16),
        label: {
          text: "VIỆT NAM",
          font: "bold 30px 'Times New Roman', serif",
          fillColor: Cesium.Color.BLACK,
          outlineColor: Cesium.Color.WHITE,
          outlineWidth: 3,
          style: Cesium.LabelStyle.FILL_AND_OUTLINE,
          verticalOrigin: Cesium.VerticalOrigin.CENTER,
          heightReference: Cesium.HeightReference.NONE,
          show: true
        }
      });

      //  Cập nhật hiện/ẩn label + đổi màu polygon
      function updateLabels() {
        const cameraHeight = viewer.camera.positionCartographic.height;
        const showProvinceLabels = cameraHeight < 600000;
        const showVietnamLabel = cameraHeight >= 500000;

        viewer.entities.values.forEach(entity => {
          if (entity.label && entity.label.text.getValue() !== "VIỆT NAM") {
            entity.label.show = showProvinceLabels;
          }
          if (entity.polygon) {
            if (showProvinceLabels) {
              // Zoom gần: polygon trong suốt
              entity.polygon.material = Cesium.Color.TRANSPARENT;
            } else {
              // Zoom xa: polygon vàng nhạt
              entity.polygon.material = Cesium.Color.YELLOW.withAlpha(0.1);
            }
          }
        });

        vietnamLabel.label.show = showVietnamLabel;
      }

      viewer.camera.changed.addEventListener(updateLabels);
      updateLabels();

    }).catch(err => {
      console.error('❌ Lỗi tải GeoJSON:', err);
    });
  </script>
</body>
</html>
