<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VN 24h Coverage – Honeycomb Beams per Satellite</title>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer { width:100%; height:100%; margin:0; padding:0; overflow:hidden; }
    .hud {
      position:absolute; left:10px; top:10px; color:#fff; font:12px/1.4 monospace; z-index:10;
      background:rgba(0,0,0,.45); padding:.6rem .8rem; border-radius:.5rem; white-space:pre;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div class="hud" id="hud"></div>

  <!-- Cesium -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>

  <script type="module">
    import * as satellite from "https://esm.sh/satellite.js";

    // ===== 1) CESIUM VIEWER =====
    Cesium.Ion.defaultAccessToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI3Yzg5M2JjZi1mOTY5LTQ4ODgtYjg2MS02NWYwYWI1YWJkNTEiLCJpZCI6MzMxNTI3LCJpYXQiOjE3NTUwNjgwNzF9.VlqKyM0AOqobv7jkWw3aB5GwptsqHs-bWFmS1KIQ4UU";

    const viewer = new Cesium.Viewer("cesiumContainer", {
      shouldAnimate: true,
      imageryProvider: new Cesium.IonImageryProvider({ assetId: 3954 }),
      terrainProvider: await Cesium.createWorldTerrainAsync(),
      baseLayerPicker: true,
      timeline: true,
      animation: true
    });
    viewer.scene.debugShowFramesPerSecond = true;
    viewer.scene.globe.enableLighting = true;
    const ellipsoid = Cesium.Ellipsoid.WGS84;

    // ===== 2) THAM SỐ PHỦ SÓNG & TRẠM MẶT ĐẤT =====
    // Beam footprint vẽ là hình tròn trên bề mặt 3D (ellipse a=b). Khi xem 2D có thể trông elip do phép chiếu.
    const BEAM_RADIUS_KM = 240;
    const BEAM_R = BEAM_RADIUS_KM * 1000;

    // “Tổ ong” per satellite: số vòng (rings=2 => 19 beam/VS; rings=3 => 37 beam/VS)
    const BEEHIVE_RINGS = 2;

    // Hộp phủ sóng (VN xấp xỉ)
    const VN = { minLon: 102, maxLon: 110, minLat: 8, maxLat: 23 };
    const midLat = (VN.minLat + VN.maxLat) / 2;

    const groundStations = [
      { name: "Ha Noi", lon: 105.83, lat: 21.02 },
      { name: "Da Nang", lon: 108.22, lat: 16.06 },
      { name: "Ho Chi Minh", lon: 106.66, lat: 10.75 },
      { name: "Can Tho", lon: 105.78, lat: 10.04 },
      { name: "Singapore", lon: 103.85, lat: 1.35 },
      { name: "Tokyo", lon: 139.69, lat: 35.68 }
    ];
    groundStations.forEach(s => {
      s.ecf = Cesium.Cartesian3.fromDegrees(s.lon, s.lat);
      viewer.entities.add({
        position: s.ecf,
        point: { pixelSize: 12, color: Cesium.Color.AQUA, outlineColor: Cesium.Color.WHITE, outlineWidth: 2 },
        label: { text: s.name, font: '12pt monospace', style: Cesium.LabelStyle.FILL_AND_OUTLINE, outlineWidth: 2,
                 verticalOrigin: Cesium.VerticalOrigin.TOP, pixelOffset: new Cesium.Cartesian2(0, 12) }
      });
    });

    // ===== 3) ISS (TLE thật) để tham chiếu =====
    const ISS = {
      name: "ISS",
      tle1: "1 25544U 98067A   24227.56193912  .00016717  00000-0  30129-3 0  9995",
      tle2: "2 25544  51.6403 272.2530 0007219 130.4312 321.4938 15.49380015468249"
    };
    const issRec = satellite.twoline2satrec(ISS.tle1, ISS.tle2);
    function issEcef(time) {
      const d = Cesium.JulianDate.toDate(time);
      const pv = satellite.propagate(issRec, d);
      if (!pv || !pv.position) return null;
      const gmst = satellite.gstime(d);
      const ecf = satellite.eciToEcf(pv.position, gmst);
      return new Cesium.Cartesian3(ecf.x*1000, ecf.y*1000, ecf.z*1000);
    }
    const iss = viewer.entities.add({
      name: "ISS",
      position: new Cesium.CallbackProperty(issEcef, false),
      point: { pixelSize: 10, color: Cesium.Color.YELLOW }
    });

    // ===== 4) TÍNH SỐ VỆ TINH (hex-packing) ĐỂ 24h COVERAGE VN =====
    const widthKm  = (VN.maxLon - VN.minLon) * 111 * Math.cos(Cesium.Math.toRadians(midLat));
    const heightKm = (VN.maxLat - VN.minLat) * 111;

    // spacing hex lý tưởng (hướng Đông-Tây: √3·r ; Bắc-Nam: 1.5·r)
    const Nlon = Math.max(3, Math.ceil(widthKm  / (Math.sqrt(3) * BEAM_RADIUS_KM)));
    const Nlat = Math.max(2, Math.ceil(heightKm / (1.5 * BEAM_RADIUS_KM)));

    // Walker: P mặt phẳng, S vệ tinh/mặt phẳng (chọn tương đối dày để “liên tục” qua 24h)
    const PLANES = Nlon;                     // ~ chiều ngang
    const SATS_PER_PLANE = Math.max(3, 2*Nlat); // ~ chiều dọc (2 hàng)
    const MAX_SATS = 70;                     // giới hạn để mượt
    const TOTAL = Math.min(MAX_SATS, PLANES * SATS_PER_PLANE);

    // ===== 5) WALKER CONSTELLATION (mô phỏng) =====
    const altKm = 550;
    const R = 6371 + altKm;             // bán kính quỹ đạo (km)
    const mu = 398600.4418;             // km^3/s^2
    const n = Math.sqrt(mu / Math.pow(R,3)); // rad/s (mean motion)
    const inc = Cesium.Math.toRadians(53);
    const walkerDelta = 1;

    function walkerEcef(time, plane, index, P, S, delta=1) {
      const t = Cesium.JulianDate.toDate(time).getTime()/1000;
      const raan = 2*Math.PI * (plane / P);           // chia đều RAAN
      const M0   = 2*Math.PI * ((index + delta*plane) / S); // lệch pha
      const u    = M0 + n * t;                         // ω=0 => u = M

      const x_op = R * Math.cos(u), y_op = R * Math.sin(u); // ECI trong mặt phẳng
      const cosO = Math.cos(raan), sinO = Math.sin(raan);
      const cosi = Math.cos(inc),  sini = Math.sin(inc);

      const x1 = x_op;
      const y1 = y_op * cosi;
      const z1 = y_op * sini;

      const x =  cosO*x1 - sinO*y1;
      const y =  sinO*x1 + cosO*y1;
      const z =  z1;

      const m = Cesium.Transforms.computeIcrfToFixedMatrix(time);
      if (!m) return null;
      const eci = new Cesium.Cartesian3(x*1000, y*1000, z*1000);
      return Cesium.Matrix3.multiplyByVector(m, eci, new Cesium.Cartesian3());
    }

    // ===== 6) HÀM TẠO LƯỚI TỔ ONG (offset ENU) =====
    function genHexOffsets(rings, radius_m){
      const out=[], h = radius_m*1.5, v = radius_m*Math.sqrt(3)/2;
      out.push({x:0, y:0}); // tâm
      for(let ring=1; ring<=rings; ring++){
        const step = 60; // 6 cạnh
        for (let dir=0; dir<6; dir++){
          for (let k=0; k<ring; k++){
            const angle = Cesium.Math.toRadians(dir*60);
            const dx = ring * h * Math.cos(angle);
            const dy = ring * v * Math.sin(angle);
            // dịch dọc cạnh (xấp xỉ) để đủ ring*6 điểm
            const edgeAng = Cesium.Math.toRadians(dir*60 + 60);
            const ex = (k/ring) * (h*Math.cos(edgeAng));
            const ey = (k/ring) * (v*Math.sin(edgeAng));
            out.push({x: dx+ex, y: dy+ey});
          }
        }
      }
      return out;
    }
    const beehiveOffsets = genHexOffsets(BEEHIVE_RINGS, BEAM_R);

    // ===== 7) TẠO MỖI VỆ TINH + CHÙM BEAM TỔ ONG + LOGIC TRẠM =====
    const sats = [];
    let count = 0;

    // helper: với một vệ tinh, tìm ô beam gần nhất đến trạm (để kích hoạt link)
    function nearestCellPos(time, satEntity, stationEcf){
      const p = satEntity.position.getValue(time); if(!p) return null;
      const sub = ellipsoid.scaleToGeodeticSurface(p);
      const enu = Cesium.Transforms.eastNorthUpToFixedFrame(sub);
      let best=null, bestD=Number.POSITIVE_INFINITY, pos=null;
      for(const off of beehiveOffsets){
        pos = Cesium.Matrix4.multiplyByPoint(enu, new Cesium.Cartesian3(off.x, off.y, 0), new Cesium.Cartesian3());
        const d = Cesium.Cartesian3.distance(pos, stationEcf);
        if(d < bestD){ bestD = d; best = pos; }
      }
      return {pos: best, dist: bestD};
    }

    for (let p=0; p<PLANES && count<TOTAL; p++){
      for (let s=0; s<SATS_PER_PLANE && count<TOTAL; s++){
        const sat = viewer.entities.add({
          name: `LEO-${p+1}-${s+1}`,
          position: new Cesium.CallbackProperty(t => walkerEcef(t, p, s, PLANES, SATS_PER_PLANE, walkerDelta), false),
          point: { pixelSize: 7, color: Cesium.Color.YELLOW.withAlpha(0.95) }
        });

        // Vẽ toàn bộ “tổ ong” footprint bám theo vệ tinh (ellipse a=b)
        beehiveOffsets.forEach((off, idx) => {
          viewer.entities.add({
            position: new Cesium.CallbackProperty(time=>{
              const ecef = sat.position.getValue(time); if(!ecef) return null;
              const sub = ellipsoid.scaleToGeodeticSurface(ecef);
              const enu = Cesium.Transforms.eastNorthUpToFixedFrame(sub);
              return Cesium.Matrix4.multiplyByPoint(enu, new Cesium.Cartesian3(off.x, off.y, 0), new Cesium.Cartesian3());
            }, false),
            ellipse: {
              semiMajorAxis: BEAM_R,
              semiMinorAxis: BEAM_R,
              height: 0,
              material: (idx===0 ? Cesium.Color.fromBytes(0,180,255,70) : Cesium.Color.fromBytes(0,140,255,55)),
              outline: true,
              outlineColor: (idx===0 ? Cesium.Color.fromBytes(0,200,255,200) : Cesium.Color.fromBytes(200,200,255,120)),
              outlineWidth: 1.5
            }
          });
        });

        // Liên kết tới trạm: nếu khoảng cách từ TRẠM tới ô beam gần nhất <= BEAM_R thì bật link
        groundStations.forEach(gs => {
          // footprint “active” ngay tại trạm (ẩn/hiện theo điều kiện)
          viewer.entities.add({
            position: gs.ecf,
            show: new Cesium.CallbackProperty(time=>{
              const res = nearestCellPos(time, sat, gs.ecf);
              return res && res.dist <= BEAM_R;
            }, false),
            ellipse: {
              semiMajorAxis: BEAM_R, semiMinorAxis: BEAM_R, height: 0,
              material: Cesium.Color.RED.withAlpha(0.28),
              outline: true, outlineColor: Cesium.Color.RED
            }
          });

          // đường nối vệ tinh ↔ trạm
          viewer.entities.add({
            polyline: {
              positions: new Cesium.CallbackProperty(time=>{
                const ecefSat = sat.position.getValue(time); if(!ecefSat) return [];
                const res = nearestCellPos(time, sat, gs.ecf);
                const active = res && res.dist <= BEAM_R;
                return active ? [ecefSat, gs.ecf] : [];
              }, false),
              width: 2,
              material: Cesium.Color.RED.withAlpha(0.75)
            }
          });
        });

        sats.push(sat);
        count++;
      }
    }

    // ===== 8) HUD + CAMERA =====
    const hud = document.getElementById('hud');
    const cellsPerSat = beehiveOffsets.length;
    hud.textContent =
`VN box: lon ${VN.minLon}..${VN.maxLon}, lat ${VN.minLat}..${VN.maxLat}
Beam radius: ${BEAM_RADIUS_KM} km
Hex spacing ~ EW: ${(Math.sqrt(3)*BEAM_RADIUS_KM).toFixed(0)} km, NS: ${(1.5*BEAM_RADIUS_KM).toFixed(0)} km
Estimated planes (Nlon) = ${Nlon}, sats/plane ≈ ${SATS_PER_PLANE} (≈ 2·Nlat), total = ${count}
Beehive per sat: rings=${BEEHIVE_RINGS} → ${cellsPerSat} beams (center + rings)
Total beams rendered ≈ ${count * cellsPerSat}
NOTE: Continuous 24h coverage is approximated via density + Walker phasing; fine-tune P/S or beam size if needed.`;

    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(108, 16, 1.5e7),
      duration: 3
    });
  </script>
</body>
</html>
