<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Cesium Việt Nam</title>
  <link href="https://cdn.jsdelivr.net/npm/cesium/Build/Cesium/Widgets/widgets.css" rel="stylesheet"/>
  <style>
    html, body, #cesiumContainer { width:100%; height:100%; margin:0; padding:0; overflow:hidden; }
    .hud {
      position:absolute; left:10px; top:10px; color:#fff; font:12px/1.4 monospace; z-index:10;
      background:rgba(0,0,0,.45); padding:.6rem .8rem; border-radius:.5rem; white-space:pre;
      max-width: 450px;
    }
    .panel {
      position:absolute; right:10px; top:10px; color:#fff; z-index:20;
      background:rgba(0,0,0,.55); padding:.7rem .9rem; border-radius:.6rem; font:12px/1.4 monospace;
      min-width: 240px;
    }
    #toggleSimBtn {
      position:absolute; top:10px; right:320px; z-index:30;
      background:#111; color:#0ff; border:none; padding:6px 10px; border-radius:6px;
      cursor:pointer;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer" style="width:100%; height:100%;"></div>


  <div id="hudConnection" class="hud-box"></div>
  <style>
  .hud-box {
    position: absolute;
    top: 150px;
    left: 10px;
    background: rgba(0,0,0,0.6);
    color: #0f0;
    font-family: monospace;
    padding: 6px 10px;
    border-radius: 6px;
    white-space: pre;
    font-size: 13px;
  }
</style>
  
  <!-- HUD hiển thị thông tin -->
  <div id="hud" class="hud"></div>

  <!-- Toggle Gateway Settings -->
  <button id="toggleSimBtn" 
    style="position:absolute; top:10px; right:220px; z-index:20; display:block; margin-bottom:5px;">
    ⚙ Gateway Settings
  </button>

  <!-- Gateway Settings Panel -->
  <div id="sim-controls" style="
    position:absolute; top:80px; right:10px; display:none;
    width:300px; background:rgba(0,0,0,0.85);
    color:white; padding:15px; font-family:monospace;
    border-radius:12px; font-size:13px;">
    <h3 style="margin-top:0; color:#00ffcc; text-align:center;">GATEWAY SETTINGS</h3>
    <div style="margin-top:12px;">
      <label><input type="checkbox" id="toggleGsFoot" checked> Show Gateway Footprints</label>
    </div>

    <!-- Minimum Elevation -->
    <div style="margin-bottom:16px;">
      <div style="display:flex; justify-content:space-between;">
        <span>MINIMUM ELEVATION:</span>
        <span id="gsElevVal">20°</span>
      </div>
      <input type="range" id="gsElevSlider" min="5" max="80" value="20" style="width:100%;">
    </div>

    <!-- Dishy Tilt North-South -->
    <div style="margin-bottom:16px;">
      <div style="display:flex; justify-content:space-between;">
        <span>DISHY TILT (N–S):</span>
        <span id="tiltNSVal">0°</span>
      </div>
      <input type="range" id="tiltNSSlider" min="-35" max="35" value="0" style="width:100%;">
    </div>

    <!-- Dishy Tilt East-West -->
    <div style="margin-bottom:16px;">
      <div style="display:flex; justify-content:space-between;">
        <span>DISHY TILT (E–W):</span>
        <span id="tiltEWVal">0°</span>
      </div>
      <input type="range" id="tiltEWSlider" min="-35" max="35" value="0" style="width:100%;">
    </div>

    <!-- GSO Arc Protection-->
    <div style="margin-top:16px;">
      <div style="display:flex; justify-content:space-between;">
        <span>GSO ARC PROTECTION:</span>
        <span id="gsoVal">0°</span>
      </div>
      <input type="range" id="gsoSlider" min="0" max="25" value="0" style="width:100%;">
    </div>
  </div>

  <!-- Toggle Satellite Settings -->
  <button id="toggleSatBtn" 
    style="position:absolute; top:10px; right:90px; z-index:20; display:block;">
    ⚙ Satellite Settings
  </button>

  <!-- Satellite Settings Panel -->
  <div id="sat-controls" style="
    position:absolute; top:380px; right:10px; display:none;
    width:240px; background:rgba(0,0,0,0.85);
    color:white; padding:10px; font-family:monospace;
    border-radius:8px; font-size:13px;">
    <h3 style="margin-top:0; color:#00ffcc; text-align:center;">SATELLITE SETTINGS</h3>
    <label>
      <input type="checkbox" id="toggleSpotBeam" checked>
      Show Spot Beams
    </label>
    <button id="exportData">Export Data</button>
    

    <!-- Chỉ còn checkbox -->
    <div style="margin-bottom:12px;">
      <label><input type="checkbox" id="toggleFoot" checked> Show Footprints</label>
    </div>
  </div>

  <!-- Thư viện Cesium và Satellite.js -->
  <script src="https://cdn.jsdelivr.net/npm/cesium/Build/Cesium/Cesium.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/4.1.4/satellite.min.js"></script>

  <!-- Script chính -->
  <script type="module">
    import { initializeEarthViewer } from './earth-model.js';
    import { initializeSatellites } from './satellite-orbit.js';
    import { setupHoverHUD } from './hover.js';
    import { computeLookAngles, getSatelliteLookAtGS } from './satellite-look.js';
    import { initializeSatellitesFootprint, exportSimulationData } from './sbb.js';
    import {
      setGroundStationParams,
      setGsoArcProtection,
      setFootprintVisible,
      createGroundStations
    } from './groundstation.js';
  
    async function startApplication() {
  // init viewer
  const { viewer, ellipsoid, R_E } = initializeEarthViewer();
  viewer.clock.clockStep = Cesium.ClockStep.SYSTEM_CLOCK;
  viewer.clock.clockRange = Cesium.ClockRange.UNBOUNDED;
  viewer.clock.multiplier = 1;
  viewer.clock.shouldAnimate = true;
  viewer.clock.currentTime = Cesium.JulianDate.now();
  viewer.clock.startTime = viewer.clock.currentTime.clone();

  // init satellites
  const sats = await initializeSatellites(viewer);

  // create ground stations
  const groundStations = createGroundStations(viewer, ellipsoid, R_E, { altKm: 550 });

  // initialize footprints (API object)
  const satFootprints = await initializeSatellitesFootprint(viewer, ellipsoid, R_E, sats, groundStations);
  console.log("satFootprints:", satFootprints);

  // ✅ bây giờ mới dùng được satFootprints
  satFootprints.setShowFootprints(true);
  satFootprints.setShowSpotBeams(true);
  satFootprints.setElevMin(25);

  
 
      setupHoverHUD(viewer, sats, groundStations);


      // Toggle LOS
      document.getElementById("toggleFoot").addEventListener("change", e => {
        if(satFootprints && satFootprints.setShowFootprints)
          satFootprints.setShowFootprints(!!e.target.checked);
      });

      // Toggle Spot Beam
      document.getElementById("toggleSpotBeam").addEventListener("change", e => {
        if(satFootprints && satFootprints.setShowSpotBeams)
          satFootprints.setShowSpotBeams(!!e.target.checked);
      });

  
      // --- UI wiring (gateway controls) ---
      let currentElev = 20, currentTiltNS = 0, currentTiltEW = 0, currentAzimuth = 0, currentGSO = 0;
  
      const gsElevSlider = document.getElementById("gsElevSlider");
      const gsElevVal = document.getElementById("gsElevVal");
      const tiltNSSlider = document.getElementById("tiltNSSlider");
      const tiltNSVal = document.getElementById("tiltNSVal");
      const tiltEWSlider = document.getElementById("tiltEWSlider");
      const tiltEWVal = document.getElementById("tiltEWVal");
      const gsoSlider = document.getElementById("gsoSlider");
      const gsoVal = document.getElementById("gsoVal");
      const toggleGsFoot = document.getElementById("toggleGsFoot");

      document.getElementById("exportData").addEventListener("click", () => {
  const data = exportSimulationData(viewer, sats, ellipsoid, 25);
  // Copy thẳng ra clipboard
  navigator.clipboard.writeText(JSON.stringify(data, null, 2))
    .then(() => alert("Beam & footprint data copied to clipboard!"));
});
  
      // slider for gateway min elevation (this should update footprint logic)
      if (gsElevSlider) {
        gsElevSlider.addEventListener("input", (e) => {
          currentElev = +e.target.value;
          gsElevVal.textContent = currentElev + "°";
          // update satellite footprint logic via API returned from initializeSatellitesFootprint
          if (satFootprints && typeof satFootprints.setElevMin === "function") {
            satFootprints.setElevMin(currentElev);
          } else {
            // fallback: set a global (legacy), though new implementation prefers API
            if (satFootprints && satFootprints.setElevMin) {
  satFootprints.setElevMin(currentElev);
}
setGroundStationParams(currentElev, currentTiltNS, currentTiltEW, currentAzimuth);
          }
        });
      }
  
      // Dish tilt controls (these call your groundstation helper)
      if (tiltNSSlider) {
        tiltNSSlider.addEventListener("input", (e) => {
          currentTiltNS = +e.target.value;
          let dir = currentTiltNS === 0 ? "" : (currentTiltNS > 0 ? "N" : "S");
          tiltNSVal.textContent = Math.abs(currentTiltNS) + "°" + dir;
          setGroundStationParams(currentElev, currentTiltNS, currentTiltEW, currentAzimuth);
        });
      }
  
      if (tiltEWSlider) {
        tiltEWSlider.addEventListener("input", (e) => {
          currentTiltEW = +e.target.value;
          let dir = currentTiltEW === 0 ? "" : (currentTiltEW > 0 ? "E" : "W");
          tiltEWVal.textContent = Math.abs(currentTiltEW) + "°" + dir;
          setGroundStationParams(currentElev, currentTiltNS, currentTiltEW, currentAzimuth);
        });
      }
  
      if (gsoSlider) {
        gsoSlider.addEventListener("input", (e) => {
          currentGSO = +e.target.value;
          gsoVal.textContent = currentGSO + "°";
          setGsoArcProtection(currentGSO, 40);
        });
      }
  
      if (toggleGsFoot) {
        toggleGsFoot.addEventListener("change", (e) => {
          setFootprintVisible(!!e.target.checked);
        });
      }
  
      // Toggle panels
      const toggleSimBtn = document.getElementById("toggleSimBtn");
      const simControls = document.getElementById("sim-controls");
      toggleSimBtn.addEventListener("click", () => {
        simControls.style.display = (simControls.style.display === "block") ? "none" : "block";
      });
  
      const toggleSatBtn = document.getElementById("toggleSatBtn");
      const satControls = document.getElementById("sat-controls");
      toggleSatBtn.addEventListener("click", () => {
        satControls.style.display = (satControls.style.display === "block") ? "none" : "block";
      });
  
      // Satellite footprints toggle (Show/Hide all ellipses)
      const toggleFoot = document.getElementById("toggleFoot");
      if (toggleFoot) {
        toggleFoot.addEventListener("change", (e) => {
  if (satFootprints && satFootprints.setShowFootprints) {
    satFootprints.setShowFootprints(!!e.target.checked);
  } else {
    window.showFootprints = !!e.target.checked;
  }
});
      }
    }
    startApplication().catch(err => {
      console.error("startApplication error:", err);
    });
  </script>
