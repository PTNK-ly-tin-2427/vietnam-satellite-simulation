<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Cesium Việt Nam</title>
  
  <!-- Tải CSS của Cesium -->
  <link href="https://cdn.jsdelivr.net/npm/cesium/Build/Cesium/Widgets/widgets.css" rel="stylesheet"/>
  
  <!-- CSS tùy chỉnh cho giao diện -->
  <style>
    html, body, #cesiumContainer { width:100%; height:100%; margin:0; padding:0; overflow:hidden; }
    .hud {
      position:absolute; left:10px; top:10px; color:#fff; font:12px/1.4 monospace; z-index:10;
      background:rgba(0,0,0,.45); padding:.6rem .8rem; border-radius:.5rem; white-space:pre;
      max-width: 450px;
    }
    .panel {
      position:absolute; right:10px; top:10px; color:#fff; z-index:20;
      background:rgba(0,0,0,.55); padding:.7rem .9rem; border-radius:.6rem; font:12px/1.4 monospace;
      min-width: 240px;
    }
    .row { display:flex; align-items:center; gap:.5rem; margin:.3rem 0; }
    .row input[type=range] { flex-grow: 1; }
    .tag { display:inline-block; padding:.1rem .35rem; background:#1f2937; border-radius:.35rem; margin-left:.35rem;}
  </style>
</head>
<body>

  <!-- Các thành phần giao diện người dùng -->
  <div id="cesiumContainer"></div>
  <div class="hud" id="hud"></div>

  <div class="panel">
    <div class="row">
      <label><input type="checkbox" id="toggleFoot" checked> Hiển thị Footprint</label>
    </div>
    <div class="row">
      <label for="elevSlider">Góc ngẩng ε:</label>
      <input type="range" id="elevSlider" min="5" max="60" step="1" value="40">
      <span id="elevVal" class="tag">40°</span>
    </div>
  </div>
  <!-- Tải thư viện Cesium và Satellite.js -->
  <script src="https://cdn.jsdelivr.net/npm/cesium/Build/Cesium/Cesium.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/4.1.4/satellite.min.js"></script>
  
  <!-- SCRIPT LOGIC CHÍNH  -->
  <script type="module">
    // Nhập các hàm khởi tạo từ các module bên ngoài
    import { initializeEarthViewer } from './earth-model.js';
    import { initializeSatellites } from './satellite-orbit.js';
    import { initializeSatellitesFootprint } from './satellite-beam.js';

    async function startApplication() {
      // 1. Khởi tạo Trái Đất và viewer
      const { viewer, ellipsoid, R_E } = initializeEarthViewer();

      // 2. Khởi tạo các vệ tinh
      const sats = await initializeSatellites(viewer);

      // 3. Khởi tạo footprint với dữ liệu vệ tinh đã nhận được
      initializeSatellitesFootprint(viewer, ellipsoid, R_E, sats);
    }

    // Gọi hàm chính để bắt đầu ứng dụng
    startApplication();
  </script>

</body>
</html>
