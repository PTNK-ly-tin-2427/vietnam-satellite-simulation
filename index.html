<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<title>Vietnam Globe — Day/Night + Timeline</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
  :root{--ui-bg:rgba(6,10,20,0.6);--ui-border:rgba(255,255,255,0.06);--label-bg:rgba(0,0,0,0.55)}
  html,body{height:100%;margin:0;background:#001226;color:#e6eef8;font-family:system-ui,Arial;overflow:hidden}
  canvas{display:block}
  #ui{position:absolute;left:12px;top:12px;z-index:60;background:var(--ui-bg);border:1px solid var(--ui-border);padding:10px;border-radius:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;backdrop-filter:blur(6px)}
  button,select{cursor:pointer}
  button{background:#0f1724;color:#dbeafe;border:1px solid var(--ui-border);padding:6px 10px;border-radius:10px}
  label.ui{display:flex;align-items:center;gap:6px}
  .ctrl-group{display:flex;gap:8px;align-items:center}
  #timelineWrap{position:absolute;left:50%;transform:translateX(-50%);bottom:28px;z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;width:min(92vw,1100px);pointer-events:auto}
  #timelineBar{position:relative;width:100%;height:36px;border-top:2px solid rgba(255,255,255,0.12);user-select:none;background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent)}
  .tick{position:absolute;top:0;width:1px;background:rgba(255,255,255,0.18)}
  .tick.small{background:rgba(255,255,255,0.08);height:8px}
  .tick-label{position:absolute;top:12px;font-size:10px;color:rgba(230,238,248,0.9);white-space:nowrap;transform:translateX(-50%);text-shadow:0 1px 0 rgba(0,0,0,0.6)}
  #handle{position:absolute;top:-6px;width:14px;height:14px;border-radius:50%;background:#ffcc00;box-shadow:0 2px 6px rgba(0,0,0,0.6);transform:translateX(-50%);cursor:grab;z-index:5}
  #timeReadout{background:var(--ui-bg);border:1px solid var(--ui-border);border-radius:10px;padding:6px 10px;font-family:monospace;font-size:13px}
  #timelineControls{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  #stats{position:absolute;left:12px;bottom:12px;z-index:70;pointer-events:none}
  #credits{position:absolute;right:12px;bottom:12px;z-index:50;font-size:12px;opacity:0.7}
  .label{position:absolute;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap;text-shadow:0 0 6px rgba(0,0,0,0.9);z-index:55;font-size:10px;background:var(--label-bg);padding:1px 5px;border-radius:6px;color:#fff}
  .label.island{background:#fff3b8;color:#000}
  .label.province{background:rgba(15,23,36,0.7);border:1px solid rgba(255,255,255,0.08);font-size:10px}
  .label.country{font-weight:800;font-size:16px;background:transparent;color:#ffd76b;text-shadow:none;letter-spacing:1px}
  @media (max-width:640px){#ui{left:8px;top:8px}#timelineWrap{bottom:18px}.tick-label{font-size:9px}.label{font-size:9px}}
</style>

<!-- Dependencies -->
<script src="https://unpkg.com/suncalc@1.9.0/suncalc.js"></script>
<script src="https://unpkg.com/satellite.js@4.1.4/dist/satellite.min.js"></script>

<!-- Import Map -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/examples/jsm/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="ui">
    <div class="ctrl-group">
      <button id="btnRotate">⏯ Bật xoay</button>
      <button id="btnPlay">▶︎</button>
      <button id="btnStepBack">⏮</button>
      <button id="btnStepFwd">⏭</button>
    </div>
    <label class="ui">Speed
      <select id="speedSel">
        <option value="1">1x</option><option value="2">2x</option><option value="3">3x</option><option value="4">4x</option><option value="5">5x</option>
      </select>
    </label>
    <div style="width:8px"></div>
    <div id="credits-mini" style="font-size:12px;opacity:.9">VIỆT NAM • Day-only shading</div>
  </div>

  <div id="timelineWrap">
    <div id="timelineControls">
      <label style="font-size:13px">Timeline</label>
      <div id="timelineLegend" style="font-size:12px;color:#cfe8ff;opacity:0.9"></div>
    </div>
    <div id="timelineBar" aria-hidden="false"></div>
    <div id="timeReadout">UTC: -- | VN: -- | Slider: --</div>
  </div>

  <div id="stats"></div>
  <div id="credits">GeoJSON: local `VNM_1.geojson` • Texture: `light.jpg`</div>

  <script type="module">
  import * as THREE from "three";
  import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";
  import Stats from "three/examples/jsm/libs/stats.module.js";
  import { SatelliteTracker } from './satellite-tracker.js';
  import { EarthScene } from './earth-scene.js';

  // --- Config ---
  const INITIAL_LAT = 15.5, INITIAL_LON = 108;
  const INITIAL_DIST = 12; // Adjusted from EARTH_R + 7

  // --- Scene & Renderer ---
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x001226);
  const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  // --- Controls ---
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.minDistance = 5.5; // Adjusted from EARTH_R + 0.5
  controls.maxDistance = 65;  // Adjusted from EARTH_R + 60
  controls.enablePan = false;
  controls.autoRotate = false;
  controls.autoRotateSpeed = 30;

  // --- Stats (FPS) ---
  const stats = new Stats();
  stats.dom.style.position = "absolute";
  stats.dom.style.left = "0px";
  stats.dom.style.bottom = "0px";
  document.body.appendChild(stats.dom);

  // --- Lights ---
  const ambient = new THREE.AmbientLight(0xffffff, 0.35); scene.add(ambient);
  const sunLight = new THREE.DirectionalLight(0xffffff, 1.0); scene.add(sunLight);

  // --- Globals ---
  let earth = null;
  let earthScene = null;
  let satelliteTracker = null;

  // Time & timeline state
  let isPlaying = false;
  const baseRealNow = Date.now();
  let timelineOffsetMin = 0;
  let playSpeed = 1;

  // Timeline elements
  const timelineBar = document.getElementById('timelineBar');
  const timelineLegend = document.getElementById('timelineLegend');
  const handle = document.createElement('div');
  handle.id = 'handle';
  timelineBar.appendChild(handle);
  
  // Timeline config
  const tickHours = 12;
  const visibleSpanDays = 4;
  const totalTicks = (24 * visibleSpanDays) / tickHours;

  // --- Init ---
  (async function init(){
    // Initialize Earth and its decorations
    earthScene = new EarthScene(scene, camera);
    earth = await earthScene.init(); // earth mesh is returned here

    // Initialize satellite tracker, passing the earth mesh to it
    satelliteTracker = new SatelliteTracker(scene, camera, earth);
    satelliteTracker.loadTLE('satellites.tle');

    // Set initial camera position
    setCameraToLatLon(INITIAL_LAT, INITIAL_LON, INITIAL_DIST);

    // Setup UI and start animation
    setupUI();
    buildTimelineTicks();
    placeHandleFromOffset();
    animate();
  })();

  function setCameraToLatLon(lat, lon, distance = INITIAL_DIST) {
    const phi = (90 - lat) * Math.PI / 180;
    const theta = (lon + 180) * Math.PI / 180;
    const x = -distance * Math.sin(phi) * Math.cos(theta);
    const y = distance * Math.cos(phi);
    const z = distance * Math.sin(phi) * Math.sin(theta);
    camera.position.set(x, y, z);
    camera.lookAt(0, 0, 0);
    controls.update();
  }

  // --- UI wiring ---
  function setupUI(){
    document.getElementById('btnRotate').addEventListener('click', ()=>{
      controls.autoRotate = !controls.autoRotate;
      document.getElementById('btnRotate').textContent = controls.autoRotate ? '⏯ Tắt xoay' : '⏯ Bật xoay';
    });

    const speedSel = document.getElementById('speedSel');
    speedSel.addEventListener('change', ()=>{ playSpeed = parseInt(speedSel.value,10) || 1; });

    document.getElementById('btnPlay').addEventListener('click', ()=>{
      isPlaying = !isPlaying;
      document.getElementById('btnPlay').textContent = isPlaying ? '⏸' : '▶︎';
    });

    document.getElementById('btnStepBack').addEventListener('click', ()=>{
      timelineOffsetMin -= 60;
      forceUpdateTimeDependencies();
      placeHandleFromOffset();
    });
    document.getElementById('btnStepFwd').addEventListener('click', ()=>{
      timelineOffsetMin += 60;
      forceUpdateTimeDependencies();
      placeHandleFromOffset();
    });

    timelineBar.addEventListener('click', (ev)=>{
      if(ev.target === handle) return;
      const rect = timelineBar.getBoundingClientRect();
      const frac = Math.min(1, Math.max(0, (ev.clientX - rect.left) / rect.width));
      const spanMs = visibleSpanDays * 24 * 3600 * 1000;
      timelineOffsetMin = Math.round((Date.now() - spanMs / 2 + frac * spanMs - baseRealNow) / 60000);
      forceUpdateTimeDependencies();
      placeHandleFromOffset();
    });

    let dragging = false;
    handle.addEventListener('mousedown', (e)=>{ dragging = true; handle.style.cursor='grabbing'; e.preventDefault(); });
    window.addEventListener('mouseup', ()=>{ dragging = false; handle.style.cursor='grab'; });
    window.addEventListener('mousemove', (ev)=>{
      if(!dragging) return;
      const rect = timelineBar.getBoundingClientRect();
      const x = Math.min(rect.width, Math.max(0, ev.clientX - rect.left));
      const frac = x / rect.width;
      const spanMs = visibleSpanDays * 24 * 3600 * 1000;
      timelineOffsetMin = Math.round((Date.now() - spanMs/2 + frac * spanMs - baseRealNow) / 60000);
      forceUpdateTimeDependencies();
      placeHandleFromOffset();
    });

    playSpeed = parseInt(speedSel.value, 10) || 1;
    updateTimeReadout(); // Initial call
    setInterval(updateTimeReadout, 1000); // Update every second
  }

  // --- Timeline ticks construction ---
  function buildTimelineTicks(){
    timelineBar.innerHTML = ''; // Clear existing ticks
    timelineBar.appendChild(handle);
    const nowUTC = Date.now();
    const ms12h = 12*3600*1000;
    const vnOffsetMs = 7*3600*1000;
    const vnEpochBase = Math.floor((nowUTC + vnOffsetMs) / ms12h) * ms12h;
    const tickRefUTC = vnEpochBase - vnOffsetMs;
    const spanMs = visibleSpanDays * 24 * 3600 * 1000;
    const start = tickRefUTC - spanMs/2;

    for(let i=0; i<=totalTicks; i++){
      const tUtc = start + i * tickHours * 3600 * 1000;
      const frac = (i/totalTicks) * 100;
      const tick = document.createElement('div');
      tick.className = 'tick' + (i%2 ? ' small' : '');
      tick.style.left = frac + '%';
      tick.style.height = (i%2===0 ? '18px' : '10px');
      timelineBar.appendChild(tick);
      if(i%2===0){
        const label = document.createElement('div');
        label.className = 'tick-label';
        const dt = new Date(tUtc + vnOffsetMs); // Format in VN time
        const day = dt.getUTCDate().toString().padStart(2,'0');
        const mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][dt.getUTCMonth()];
        const hh = dt.getUTCHours().toString().padStart(2,'0');
        label.textContent = `${day} ${mon} ${hh}:00`;
        label.style.left = frac + '%';
        timelineBar.appendChild(label);
      }
    }
    timelineLegend.textContent = `Span: ${visibleSpanDays} days · Tick: ${tickHours}h · Ticks aligned to VN 00:00/12:00`;
  }

  function placeHandleFromOffset(){
    const spanMs = visibleSpanDays * 24 * 3600 * 1000;
    const start = Date.now() - spanMs/2;
    const t = baseRealNow + timelineOffsetMin * 60000;
    const frac = (t - start) / spanMs;
    handle.style.left = (Math.min(1, Math.max(0, frac)) * 100) + '%';
  }

  // --- Time Management ---
  function getSimulatedDate(){
    return new Date(baseRealNow + timelineOffsetMin * 60000);
  }

  function updateTimeReadout() {
    const realNow = new Date();
    const utcStr = realNow.toLocaleString('en-GB', { timeZone: 'UTC', hour12: false, day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }).replace(',', '');
    const vnStr = realNow.toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh', hour12: false });
    const sim = getSimulatedDate();
    const sliderLabel = sim.toLocaleString('vi-VN', { hour12: false });
    document.getElementById("timeReadout").textContent = `UTC: ${utcStr} | VN: ${vnStr} | Slider: ${sliderLabel}`;
  }

  function forceUpdateTimeDependencies(){
    const simDate = getSimulatedDate();
    if (earth) {
      const hoursSinceBase = (simDate.getTime() - baseRealNow) / (3600 * 1000);
      earth.rotation.y = hoursSinceBase * (Math.PI * 2 / 24);
    }
    updateSunForSimulatedTime(simDate);
    placeHandleFromOffset(); // Keep handle in sync if time is stepped
  }

  function updateSunForSimulatedTime(simDate){
    const sunPos = SunCalc.getPosition(simDate, 15.5, 108);
    const x = Math.cos(sunPos.altitude) * Math.cos(sunPos.azimuth);
    const y = Math.sin(sunPos.altitude);
    const z = Math.cos(sunPos.altitude) * Math.sin(sunPos.azimuth);
    sunLight.position.set(x, y, z);
    if (earthScene) earthScene.updateSunDirection(new THREE.Vector3(x,y,z));
  }

  // --- Render loop ---
  let last = performance.now();
  function animate(){
    requestAnimationFrame(animate);
    const now = performance.now();
    const dt = (now - last)/1000; last = now;

    if(isPlaying){
      timelineOffsetMin += dt * playSpeed * 60;
      forceUpdateTimeDependencies();
    }

    const simDate = getSimulatedDate();
    if(satelliteTracker) satelliteTracker.updatePositions(simDate);
    if(earthScene) earthScene.update(camera.position.length());

    controls.update();
    renderer.render(scene, camera);
    stats.update();
  }

  // --- Event Listeners ---
  window.addEventListener("resize",()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
    buildTimelineTicks();
    placeHandleFromOffset();
  });

  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  window.addEventListener('click', (event) => {
    if (!satelliteTracker) return;
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = - (event.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(satelliteTracker.getSatelliteMeshes());
    if (intersects.length > 0) {
      satelliteTracker.toggleOrbitByMesh(intersects[0].object);
    }
  });

  setTimeout(()=>{ buildTimelineTicks(); placeHandleFromOffset(); }, 120);
  </script>
</body>
</html>
